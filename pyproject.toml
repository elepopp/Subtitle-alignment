[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "subalign"
version = "0.1.0"
description = "Precise character-level subtitle & lyric alignment: ASR, script alignment, proofreading, song karaoke timing, layout-aware line breaking, styled export, LLM translation and vocal separation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "scipy>=1.8", "soundfile>=0.12"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
whisper = ["openai-whisper"]
funasr = ["funasr", "modelscope"]
ctc = ["torch", "transformers>=4.30"]
separate = ["demucs>=4.0"]
uvr = ["audio-separator"]
zh = ["pypinyin>=0.49", "jieba>=0.42"]
llm = ["anthropic>=0.60"]
all = ["faster-whisper>=1.0", "torch", "transformers>=4.30", "demucs>=4.0", "pypinyin>=0.49", "jieba>=0.42", "anthropic>=0.60"]
dev = ["pytest>=7"]

[project.scripts]
subalign = "subalign.cli:main"

[tool.setuptools.packages.find]
include = ["subalign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
